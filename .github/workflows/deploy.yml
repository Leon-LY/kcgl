name: Deploy

# 测试环境部署 —— **前半程**（docs/01 九节）。
# 一次完整部署 = 本流水线 + 本机脚本，按**网络位置**切：
#   1. 本流水线（构建推送 ghcr + 同步制品，小文件、不挑链路）：构建 app+web+tools 三镜像
#      推到 ghcr.io，按精确 commit 同步 migrations/ 与 deploy/ 工件到 /opt/kcgl，
#      并把 .env 的 KCGL_VERSION 回写成目标版本。
#   2. 本机脚本 deploy/deploy-test.sh <版本>：拉镜像、直送服务器装载、滚动更新、核对。
# 为什么镜像交付不在 CI：测试服务器的国际出口被掐到 15–23 KB/s（双向），
# 详见作业末「后续：镜像交付与滚动更新在本机执行」一步的注释。
#
# - 触发：手动 workflow_dispatch（常规）/ 推 v* tag（发版联动）；不挂在 push main 上
#   ——测试环境按需更新，不是每次提交的义务。
# - 迁移目录随部署同步（镜像与 migrations 必须同版本，Flyway 对「已应用脚本缺失」
#   会报错——这是刻意的防漂移设计）。
# - 首次部署不走本流水线：需先在服务器准备 /opt/kcgl（deploy/ 目录 + .env），
#   见 docs/deployment.md「首次部署」一节。服务器无需配置 ghcr 凭据。
# - 前置 secrets：TEST_SSH_HOST / TEST_SSH_USER / TEST_SSH_PRIVATE_KEY（部署私钥）。
#   host key 校验用 accept-new（TOFU）；收紧为 pin 时把公钥录进 known_hosts 再改。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "镜像 tag（留空=当前 commit 的 7 位短 SHA）。勿复用已交付甲方的版本号（如 v1.0.0）——会覆盖 ghcr 上同名 tag"
        required: false
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: deploy-test
  cancel-in-progress: false   # 部署不并发，排队等上一轮完成

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/leon-ly/kcgl-app
  IMAGE_WEB: ghcr.io/leon-ly/kcgl-web
  # 运维工具镜像（rsync，备份的图片快照用它执行）。测试链路曾漏交付它：backup.sh 按
  # `kcgl-tools:${KCGL_VERSION}` 找镜像，而 .env 每次部署都随 CI 前进，于是版本一往前走
  # 就找不到对应 tag，每晚 04:30 的备份直接失败（2026-10-08 实测：报「缺少备份工具镜像
  # .../kcgl-tools:v-test-904c0d1」）。生产侧 pack-release.sh 一直随包交付它，这里补齐同构。
  IMAGE_TOOLS: ghcr.io/leon-ly/kcgl-tools
  DEPLOY_DIR: /opt/kcgl

jobs:
  build-push:
    name: 构建并推送三镜像（ghcr.io）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        name: 计算版本 tag
        # 留空取 **7 位短 SHA**。早前这里直接塞 github.sha（40 位），与输入说明写的
        # 「短 SHA」不符，也与服务器 .env、升级核对里手写的短 SHA 不同形（D-121）。
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            [ -n "$version" ] || version="${GITHUB_SHA:0:7}"
          else
            version="${{ github.ref_name }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "本次版本 tag：$version"

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 kcgl-app（server）
        uses: docker/build-push-action@v7
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.IMAGE_APP }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_APP }}:latest

      - name: 构建并推送 kcgl-web（web）
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_WEB }}:latest

      - name: 构建并推送 kcgl-tools（运维工具）
        # 构建参数与生产侧 pack-release.sh 那一步逐字同源（context 都是 deploy/tools），
        # 免得两条链路各自漂出一份不同的 rsync 镜像。
        uses: docker/build-push-action@v7
        with:
          context: ./deploy/tools
          push: true
          tags: |
            ${{ env.IMAGE_TOOLS }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_TOOLS }}:latest

  deploy-test:
    name: 同步部署制品到测试环境（49.232.49.175）
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 装配 SSH 私钥
        # 病灶（2026-10-07 首次真跑才暴露）：ubuntu-latest 的 runner 家目录下**没有**
        # ~/.ssh，`install ... ~/.ssh/id_ed25519` 因目录不存在直接退出 1。本工作流此前
        # 从未被触发过（仓库一个 tag 都没有，测试环境一直是手工部署），所以一直没显形。
        # 补 mkdir -p 即可；换成 `>>` 救不了——目录缺失时重定向同样失败。
        # 顺带把「配错了」尽量就地炸在这一步：私钥为空/不可解析、SSH 连不通，各给一条
        # 明确报错，而不是几十行后 rsync 报 publickey denied。
        # 报错走 ::error:: 注解是有意的——本仓 Action 日志需 admin 权限才可读（403），
        # check-run 注解无认证可读，故障时才诊断得动。
        run: |
          set -euo pipefail
          mkdir -p -m 700 ~/.ssh
          test -n "${{ secrets.TEST_SSH_PRIVATE_KEY }}" \
            || { echo "::error::secrets.TEST_SSH_PRIVATE_KEY 为空或未配置"; exit 1; }
          printf '%s\n' "${{ secrets.TEST_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null \
            || { echo "::error::TEST_SSH_PRIVATE_KEY 不是可解析的私钥（ssh-keygen -y 失败）"; exit 1; }
          # 写 ssh 的**默认**配置路径 ~/.ssh/config，而不是自定义文件 + `-F` 指明。
          # 病因：rsync 的 -e 参数**不经 shell**，`-F ~/.ssh/ssh_config` 里的 ~ 不会被
          # 展开，ssh 拿它当字面路径去找，报 "Can't open user config file" 并退出 255
          # （2026-10-07 第三轮实测：同一份 token 下 ssh 那步通过、紧跟的 rsync 255，
          # 差别正在于 ssh 走 bash 会展开 ~、rsync 直接 exec 不会）。
          # 走默认路径则由 ssh 自行解析，任何调用方都不必再手写路径。
          # 追加而非覆盖：保留 runner 可能已有的配置。
          {
            echo "StrictHostKeyChecking=accept-new"
            echo "UserKnownHostsFile=~/.ssh/known_hosts"
          } >> ~/.ssh/config
          ssh -o BatchMode=yes -o ConnectTimeout=10 \
            "${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}" true \
            || { echo "::error::SSH 连通失败：TEST_SSH_USER / TEST_SSH_HOST / 私钥 三者对不上"; exit 1; }

      - name: 同步迁移目录（与镜像同版本）
        run: >
          rsync -az --delete -e "ssh"
          server/src/main/resources/db/migration/
          ${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}:${{ env.DEPLOY_DIR }}/migrations/

      - name: 同步部署工件（与镜像同版本）
        # D-093（生产侧为 deploy/upgrade.sh）：部署工件是**一整套**。只同步
        # migrations/ 而不同步 compose，则 compose 里的 KCGL_VERSION 透传永远到不了
        # 服务器——镜像换了、巡检全绿，但「システム状況」的版本一直停在 jar 清单
        # 版本（0.1.0-SNAPSHOT），核对项永远通不过。生产走 upgrade.sh 批量同步，
        # 测试环境在此对齐。
        # 不同步：.env（服务器私密配置，只由首次部署生成）、db-init/（仅首启生效）、
        # nginx/（web 层，独立生命周期）。
        run: >
          rsync -az -e "ssh"
          deploy/docker-compose.yml deploy/grants.sql deploy/backup.sh deploy/restore.sh
          deploy/verify-grants.sh deploy/kcgl-doctor.sh deploy/security-selfcheck.sh
          deploy/db-cli.sh
          ${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}:${{ env.DEPLOY_DIR }}/

      - name: 回写 KCGL_VERSION 到服务器 .env（消除「.env 撒谎」漂移）
        # 病灶：本流水线一直用「KCGL_VERSION=... docker compose up -d」的内联形式覆盖，
        # 从不写回 .env，于是 .env 的版本永远停在首次部署那一刻。之后任何人手动
        # `docker compose up -d`（不带内联变量）都会按那份陈旧值把 app/web 双双拉回旧镜像
        # ——compose 里是 ${KCGL_VERSION:-latest}（deploy/docker-compose.yml:92/139）——
        # 而 Flyway 迁移已前进，属于静默回滚。2026-10-07 实测 .env 停在 v1.0.0、实际
        # 跑的是 fb70eec，即此病灶（D-121）。
        # 放在 up 之前：.env 只会「指向前」而不会「指向后」，即使本轮部署失败，下一次
        # 手动 up 也只会朝目标版本走，不会倒退；本步自带 grep 校验，写不进去就整轮中止，
        # 不会带着一份没落地的 .env 去动容器。
        run: >
          ssh ${{ secrets.TEST_SSH_USER }}@${{ secrets.TEST_SSH_HOST }}
          "cd ${{ env.DEPLOY_DIR }} &&
          cp -f .env .env.bak-\$(date +%Y%m%d%H%M%S) &&
          if grep -q '^KCGL_VERSION=' .env; then
          sed -i 's|^KCGL_VERSION=.*|KCGL_VERSION=${{ needs.build-push.outputs.version }}|' .env;
          else printf 'KCGL_VERSION=${{ needs.build-push.outputs.version }}\n' >> .env; fi &&
          grep -n '^KCGL_VERSION=' .env &&
          grep -q '^KCGL_VERSION=${{ needs.build-push.outputs.version }}\$' .env &&
          echo '✓ .env 已回写为本次版本'"

      - name: 后续：镜像交付与滚动更新在本机执行
        # 到这里，本作业完成了它**能**完成的部分：按精确 commit 同步 migrations/
        # 与部署工件、把 .env 的 KCGL_VERSION 回写成目标版本（后两步见上）。
        #
        # 为什么镜像交付不在这里：测试服务器的**国际出口被掐到 15–23 KB/s，双向**。
        # 2026-10-07 三次实测——服务器自己 `docker compose pull` 从 ghcr 拉，56 分钟
        # 没拉完一个镜像；换成 runner 代下后经 SSH 直送，只有 15 KB/s（600MB 要 11
        # 小时，实测 4 分钟无爬坡）；而本机在境内，`docker save | ssh docker load`
        # 是 18 MB/s、33 秒。差 1000 倍，差别只在有没有跨境。所以把活按网络位置切：
        # 构建推送 ghcr 与制品同步（小文件）留在 CI，取镜像这一段放本机。
        #
        # 本机侧：deploy/deploy-test.sh <版本>，它内含滚动更新、健康验证、版本核对
        # 与巡检（原本是本作业的后续三步）。它以「.env 已回写为 <版本>」为凭证校验
        # 本作业确实跑过——两半不会错配；因此本作业必须先跑，且必须先绿。
        run: |
          echo "::notice::镜像交付与滚动更新属境内侧操作，请在本机执行：deploy/deploy-test.sh ${{ needs.build-push.outputs.version }}"
          echo "本作业已完成：migrations/ 与部署工件同步、.env 回写为 ${{ needs.build-push.outputs.version }}"
          echo "本机待做：docker pull → docker save | ssh docker load → compose up -d --pull never → 核对"
