name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（Maven verify，Testcontainers 需 Docker）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: mvn verify
        run: ./mvnw -B verify

  frontend:
    name: 前端（lint / vitest / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    name: E2E（Playwright 冒烟，一次性 MySQL 容器栈）
    # main 直推才跑（PR 由 backend/frontend 把关）；需要 Docker 拉起一次性 mysql:8.4
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: 打包后端 jar（单测已在 backend job 把关）
        working-directory: server
        run: ./mvnw -B -DskipTests package
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装前端依赖
        working-directory: web
        run: npm ci
      - name: 安装 Playwright 浏览器
        working-directory: web
        # webkit 必须装：webkit-smoke project（iPhone 13 设备=WebKit 引擎）
        # 曾只装 chromium，两例被静默 skip——CI 假绿（M6-③ 引入，此处修正）
        run: npx playwright install --with-deps chromium webkit
      - name: 运行 E2E
        working-directory: web
        run: npx playwright test
      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  trace-audit:
    name: 痕迹审计（提交身份唯一 + 关键词零命中）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 提交身份唯一性（人类提交者唯一；机器人协作除外）
        # Dependabot 分支：作者=dependabot[bot]，提交者=GitHub <noreply@github.com>——
        # 统一按 noreply 域排除；审计范围=HEAD（本次构建内容），不受其他分支噪声影响
        run: |
          IDENTITIES=$(git log HEAD --format='%an <%ae>%n%cn <%ce>' | grep -viE 'noreply\.github\.com|\[bot\]' | sort -u)
          echo "$IDENTITIES"
          if [ "$(echo "$IDENTITIES" | grep -c .)" -ne 1 ]; then
            echo "::error::人类提交身份不为唯一"
            exit 1
          fi
      - name: 痕迹关键词扫描（工作区+本次构建历史）
        # 模式用字符类打散书写，避免本文件自身命中扫描
        run: |
          if git grep -iE 'cl[a]ude|anthr[o]pic|cop[i]lot' -- . ; then
            echo "::error::工作区检测到禁用关键词"
            exit 1
          fi
          if git log HEAD -p --no-color | grep -iqE 'cl[a]ude|anthr[o]pic|cop[i]lot' ; then
            echo "::error::提交历史检测到禁用关键词"
            exit 1
          fi
          echo "痕迹审计通过"
