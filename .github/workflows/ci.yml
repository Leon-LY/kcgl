name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（Maven verify，Testcontainers 需 Docker）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: mvn verify
        run: ./mvnw -B verify

  frontend:
    name: 前端（lint / vitest / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  trace-audit:
    name: 痕迹审计（提交身份唯一 + 关键词零命中）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 提交身份唯一性
        run: |
          IDENTITIES=$(git log --format='%an <%ae>%n%cn <%ce>' | sort -u)
          echo "$IDENTITIES"
          if [ "$(echo "$IDENTITIES" | wc -l)" -ne 1 ]; then
            echo "::error::仓库内出现多个提交身份"
            exit 1
          fi
      - name: 痕迹关键词扫描（工作区+全历史）
        # 模式用字符类打散书写，避免本文件自身命中扫描
        run: |
          if git grep -iE 'cl[a]ude|anthr[o]pic|cop[i]lot' -- . ; then
            echo "::error::工作区检测到禁用关键词"
            exit 1
          fi
          if git log --all -p --no-color | grep -iqE 'cl[a]ude|anthr[o]pic|cop[i]lot' ; then
            echo "::error::提交历史检测到禁用关键词"
            exit 1
          fi
          echo "痕迹审计通过"
