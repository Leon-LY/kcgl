name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（Maven verify，Testcontainers 需 Docker）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: mvn verify
        run: ./mvnw -B verify

  frontend:
    name: 前端（lint / vitest / build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  trace-audit:
    name: 痕迹审计（提交身份唯一 + 关键词零命中）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 提交身份唯一性（人类提交者唯一；机器人协作除外）
        # Dependabot 分支：作者=dependabot[bot]，提交者=GitHub <noreply@github.com>——
        # 统一按 noreply 域排除；审计范围=HEAD（本次构建内容），不受其他分支噪声影响
        run: |
          IDENTITIES=$(git log HEAD --format='%an <%ae>%n%cn <%ce>' | grep -viE 'noreply\.github\.com|\[bot\]' | sort -u)
          echo "$IDENTITIES"
          if [ "$(echo "$IDENTITIES" | grep -c .)" -ne 1 ]; then
            echo "::error::人类提交身份不为唯一"
            exit 1
          fi
      - name: 痕迹关键词扫描（工作区+本次构建历史）
        # 模式用字符类打散书写，避免本文件自身命中扫描
        run: |
          if git grep -iE 'cl[a]ude|anthr[o]pic|cop[i]lot' -- . ; then
            echo "::error::工作区检测到禁用关键词"
            exit 1
          fi
          if git log HEAD -p --no-color | grep -iqE 'cl[a]ude|anthr[o]pic|cop[i]lot' ; then
            echo "::error::提交历史检测到禁用关键词"
            exit 1
          fi
          echo "痕迹审计通过"
