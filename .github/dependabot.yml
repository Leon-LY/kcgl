# 依赖升级流（docs/01 三节版本纪律：锁版复核是一次性动作，持续升级交给 Dependabot）
version: 2
updates:
  - package-ecosystem: maven
    directory: /server
    schedule:
      interval: weekly
    groups:
      maven-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    # 仅更新 lockfile（package.json 声明范围内）：typescript ~5.9 / eslint ^9 等
    # 核心工具链的大版本升级必须人工评审后手动改范围（如 TS7 为无 JS API 的不兼容重写版），
    # Dependabot 不代为改写 package.json
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    # 运行时/构建镜像锁 Java 21 LTS（docs/04 D-016）：major（JDK 22/24 线）不自动接
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]
