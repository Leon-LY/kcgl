# 依赖升级流（docs/01 三节版本纪律：锁版复核是一次性动作，持续升级交给 Dependabot）
version: 2
updates:
  - package-ecosystem: maven
    directory: /server
    schedule:
      interval: weekly
    groups:
      maven-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    # 仅更新 lockfile（package.json 声明范围内）：typescript ~5.9 / eslint ^9 等
    # 核心工具链的大版本升级必须人工评审后手动改范围（如 TS7 为无 JS API 的不兼容重写版），
    # Dependabot 不代为改写 package.json
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
    # 运行时镜像锁 Java 21 LTS（docs/04 D-016）：major（JDK 22/24 线）不自动接，
    # 21.x 安全补丁照常接
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # 构建镜像（maven）复合标签捆绑 Maven+JDK 版本，Dependabot 的 docker 版本学
      # 无法稳定归类 major（实测 3.9-eclipse-temurin-21→3-eclipse-temurin-24 被判非 major）；
      # 且构建容器仅 CI 临时存在无运行时暴露面——整体不自动升，升级一律人工评审
      - dependency-name: "maven"
