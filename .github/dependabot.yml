# 依赖升级流（docs/01 三节版本纪律：锁版复核是一次性动作，持续升级交给 Dependabot）
version: 2
updates:
  - package-ecosystem: maven
    directory: /server
    schedule:
      interval: weekly
    groups:
      maven-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
