# kcgl-web nginx（docs/01 9.1）：静态产物 + 图片只读卷直出 + API/SSE 反代。
# 同源铁律：前后端必须同一 origin（SameSite=Strict 依赖），本配置即整个系统的
# 唯一入口；/actuator 不对外暴露（healthcheck 走容器内 127.0.0.1:8080）。
server {
    listen 80;
    server_name _;

    # 容器层上传上限与 Spring multipart（KCGL_MAX_FILE_SIZE，60MB）对齐——
    # nginx 默认 1m，不配则照片/CSV/Excel 上传全线 413，部署即坏
    client_max_body_size 60m;

    include /etc/nginx/snippets/kcgl-security-headers.conf;

    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css;
    gzip_min_length 1024;

    # ---------- 静态产物（Vite dist，带 hash 文件名 → immutable 长缓存） ----------
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        include /etc/nginx/snippets/kcgl-security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SW 与 manifest 永不缓存（发版更新链路的正确性依赖每次取新）
    location = /sw.js {
        include /etc/nginx/snippets/kcgl-security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/kcgl-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # index.html 同样永不缓存（D-163）：它是「指向本次构建那批 hash 资源」的指针。
    # 它落在下面的 location / 兜底里，而那里只出 Last-Modified/ETag——浏览器可据此
    # 自行启发式缓存，于是发版后仍被旧壳挡着，表现与 SW 预缓存那个坑一样
    # （D-162）。try_files 的末位参数是**内部重定向**，会重新跑一遍 location 匹配，
    # 故 / 与任意 SPA 深链最终都命中这条精确匹配。
    location = /index.html {
        include /etc/nginx/snippets/kcgl-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # ---------- 图片直出（app 数据卷只读挂载；URL /img/{thumb|orig}/.. 与
    # app 静态资源同路径——dev 经 Vite 代理，生产经此处，路径契约不变） ----------
    location /img/ {
        include /etc/nginx/snippets/kcgl-security-headers.conf;
        alias /data/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex" always;
    }

    # ---------- SSE：禁缓冲、长读超时（app 侧 mvc async request-timeout=12h） ----------
    # 精确匹配到唯一 SSE 端点（SyncController /api/sync/events；前端 SYNC_URL 同源同路径）。
    # 原写 location /api/sse 是**死配置**——真实路径不匹配，请求落到下面的 /api/ 段：
    # nginx 默认 proxy_buffering on 会把事件攒住，仅靠响应头 X-Accel-Buffering: no 兜底。
    # 匹配范围必须比 /api/ 更精确才生效，故用 = 精确匹配（路径内不含查询串）。
    location = /api/sync/events {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 12h;
    }

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- SPA 兜底 ----------
    location / {
        include /etc/nginx/snippets/kcgl-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
