# kcgl-web nginx（docs/01 9.1）：静态产物 + 图片只读卷直出 + API/SSE 反代。
# 同源铁律：前后端必须同一 origin（SameSite=Strict 依赖），本配置即整个系统的
# 唯一入口；/actuator 不对外暴露（healthcheck 走容器内 127.0.0.1:8080）。
server {
    listen 80;
    server_name _;

    # 容器层上传上限与 Spring multipart（KCGL_MAX_FILE_SIZE，60MB）对齐——
    # nginx 默认 1m，不配则照片/CSV/Excel 上传全线 413，部署即坏
    client_max_body_size 60m;

    include /etc/nginx/snippets/kcgl-security-headers.conf;

    gzip on;
    gzip_types application/javascript application/json image/svg+xml text/css;
    gzip_min_length 1024;

    # ---------- 静态产物（Vite dist，带 hash 文件名 → immutable 长缓存） ----------
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        include /etc/nginx/snippets/kcgl-security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SW 与 manifest 永不缓存（发版更新链路的正确性依赖每次取新）
    location = /sw.js {
        include /etc/nginx/snippets/kcgl-security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/kcgl-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # ---------- 图片直出（app 数据卷只读挂载；URL /img/{thumb|orig}/.. 与
    # app 静态资源同路径——dev 经 Vite 代理，生产经此处，路径契约不变） ----------
    location /img/ {
        include /etc/nginx/snippets/kcgl-security-headers.conf;
        alias /data/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex" always;
    }

    # ---------- SSE：禁缓冲、长读超时（app 侧 mvc async request-timeout=12h） ----------
    location /api/sse {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 12h;
    }

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- SPA 兜底 ----------
    location / {
        include /etc/nginx/snippets/kcgl-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
