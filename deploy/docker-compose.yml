# kcgl 部署栈（docs/01 九节）：MySQL + Flyway 迁移一次性容器 + app + web(nginx)。
# 与根目录 docker-compose.yml（本地开发栈）的区别：
# - 迁移走独立 kcgl-migrate 容器（kcgl_migrate 账号，跑完即退）；app 禁用 Flyway
#   ——业务账号无 DDL 权限，账号分离靠结构保证而非约定（docs/01 八节）。
# - DB 不暴露宿主端口（备份/巡检走 docker compose exec，攻击面最小化）。
# - web 镜像自带 nginx（静态+图片直出+API/SSE 反代），配置挂载 deploy/nginx/。
# - 外部端口默认非标 8082：大陆节点未备案域名 80/443 被运营商层拦截（D-077 ICP 首查），
#   备案域名就绪后经 .env 切 443+TLS（见 docs/deployment.md 决策树）。
# - migrations/ 目录由部署流程从仓库 server/src/main/resources/db/migration 同步
#   （单一事实源；镜像与迁移目录必须同版本，Flyway 校验已应用脚本缺失会报错）。
name: kcgl

services:
  mysql:
    image: mysql:8.4
    container_name: kcgl-mysql
    # 与本地开发栈同口径：utf8mb4/JST/关 performance-schema（D-008）；
    # buffer pool 经 .env 调整——共享测试机上压到 256M（勘察结论 D-077：整机
    # 3.3G/可用 1.0G/无 swap，稳态优先），独立生产主机按规格放大
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=${KCGL_INNODB_BUFFER:-384M}
      - --binlog-expire-logs-seconds=604800
    environment:
      MYSQL_DATABASE: kcgl
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 配置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Tokyo
      # 业务/迁移账号由 db-init/01-accounts.sh 首启创建（最小 GRANT）；
      # 不用 MYSQL_USER 官方变量——默认库全权不合权限口径
      KCGL_DB_PASSWORD: ${DB_PASSWORD:?请在 .env 配置 DB_PASSWORD}
      KCGL_MIGRATE_PASSWORD: ${DB_MIGRATE_PASSWORD:?请在 .env 配置 DB_MIGRATE_PASSWORD}
    volumes:
      - kcgl-mysql-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 共享测试机口径（勘察 D-077：可用 1.0G 无 swap）——三容器 limits 合计
          # 1120M 为防失控上限，稳态实际 ~800M；独立主机按规格放宽
          memory: 448M

  # 迁移一次性容器：Flyway 官方镜像（flyway/flyway，官方没有 library 短名）
  # + 迁移目录挂载，kcgl_migrate 账号（库全权）
  migrate:
    image: flyway/flyway:11-alpine
    container_name: kcgl-migrate
    # allowPublicKeyRetrieval：MySQL 8.4 默认 caching_sha2_password，容器内网
    # 非 TLS 首连需 RSA 公钥检索（app 侧 application.yml 同参数）
    command: >
      -url=jdbc:mysql://mysql:3306/kcgl?allowPublicKeyRetrieval=true
      -user=kcgl_migrate
      -password=${DB_MIGRATE_PASSWORD}
      -connectRetries=10
      -locations=filesystem:/flyway/sql
      migrate
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  # 表级授权一次性容器：业务账号最小 GRANT 必须在建表之后执行（首启顺序
  # initdb.d 建号 → migrate 建表 → 本容器 → app）。幂等可重跑；部署时
  # compose up --force-recreate 确保迁移/授权随版本更新重放（deploy.yml）
  grants:
    image: mysql:8.4
    container_name: kcgl-grants
    command: sh -c "mysql -hmysql -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --show-warnings kcgl < /grants.sql"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 配置 MYSQL_ROOT_PASSWORD}
    volumes:
      - ./grants.sql:/grants.sql:ro
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    image: ghcr.io/leon-ly/kcgl-app:${KCGL_VERSION:-latest}
    container_name: kcgl-app
    environment:
      TZ: Asia/Tokyo
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: kcgl
      DB_USER: kcgl
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 配置 DB_PASSWORD}
      # 迁移已由 migrate 容器完成；app 无 DDL 权限，禁用后启动即连业务表
      SPRING_FLYWAY_ENABLED: "false"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 同源部署：填实际访问源（如 http://49.232.49.175:8082 或 https://kcgl.example.com）
      KCGL_ALLOWED_ORIGINS: ${KCGL_ALLOWED_ORIGINS:?请在 .env 配置实际访问源}
      KCGL_IMAGE_DIR: /data/images
      KCGL_YAHOO_IMPORTS_DIR: /data/imports/yahoo
      KCGL_EXCEL_IMPORTS_DIR: /data/imports/excel
      # backup-status.json（backup.sh 产出）→ 系统状况页「直近バックアップ成功時刻」
      KCGL_BACKUP_STATUS: /data/backup/backup-status.json
      # 弱值拒启（验收 12）显式开启：与 application.yml 默认值一致，写出来是为了让
      # 「部署面开着这道闸」在部署工件上可读可审；关掉它=样板口令（change-me-*）也能起
      KCGL_SECRET_GUARD: "true"
    volumes:
      - kcgl-app-data:/data
      # 备份目录只读挂载：app 只读状态文件，绝无写备份面（备份写入仅宿主 backup.sh）
      - ${KCGL_BACKUP_DIR:?请在 .env 配置 KCGL_BACKUP_DIR}:/data/backup:ro
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      grants:
        condition: service_completed_successfully
    restart: unless-stopped
    # app 优雅停机 30s（SSE/在途请求排空），compose 宽限期须大于它，否则 10s 即 SIGKILL
    stop_grace_period: 35s
    deploy:
      resources:
        limits:
          # JVM MaxRAMPercentage=75 → 堆 ~432M（压测余量）；共享测试机压缩口径见上
          memory: 576M

  web:
    image: ghcr.io/leon-ly/kcgl-web:${KCGL_VERSION:-latest}
    container_name: kcgl-web
    ports:
      - "${WEB_PORT:-8082}:80"
    volumes:
      - ./nginx/kcgl-web.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/kcgl-security-headers.conf:ro
      # 图片只读直出（/img/ alias 到此卷；app 同卷读写）
      - kcgl-app-data:/data:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 96M

volumes:
  kcgl-mysql-data:
  kcgl-app-data:
