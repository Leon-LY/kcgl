# kcgl-server 基线配置（全环境共用；环境差异全部走环境变量注入，见 docker-compose 与部署文档）
spring:
  application:
    name: kcgl-server
  datasource:
    # 时区链路（docs/01 7.8）：connectionTimeZone=Asia/Tokyo + forceConnectionTimeZoneToSession，
    # 实体一律 LocalDateTime，DATETIME 存 JST；rewriteBatchedStatements 为批量导入提速。
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kcgl}?connectionTimeZone=Asia/Tokyo&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true&useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true
    username: ${DB_USER:kcgl}
    password: ${DB_PASSWORD:kcgl_dev_password}
    hikari:
      maximum-pool-size: 16          # 10 并发录入压测余量（docs/01 7.6）
      connection-timeout: 5000
      max-lifetime: 1740000
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 生产部署以环境变量注入独立迁移账号（SPRING_FLYWAY_USER/SPRING_FLYWAY_PASSWORD，
    # 与业务账号分离，见 docs/01 八节 DB 账号分离）；本地开发与测试复用数据源账号。
  jackson:
    time-zone: Asia/Tokyo
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 12h           # SSE 长连接（docs/01 7.6），不依赖容器默认 30s
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      # 容器层粗筛上限=全部业务上限最大值的余量（图片 5MB/CSV 50MB/Excel 20MB → 60MB）；
      # 超限由容器拒收并映射 400016 UPLOAD_TOO_LARGE（通用文案），精确校验在各业务 Service
      max-file-size: ${KCGL_MAX_FILE_SIZE:60MB}
      max-request-size: ${KCGL_MAX_REQUEST_SIZE:64MB}

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}   # 生产 HTTPS 环境注入 true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# CSRF 双保险的 Origin 白名单（docs/01 八节）；生产注入实际域名，如 https://kcgl.example.com
kcgl:
  security:
    allowed-origins: ${KCGL_ALLOWED_ORIGINS:}
    # 启动期弱值拒启（验收 12）：部署面默认开启——样板值/弱口令一律拒绝启动。
    # 仅本地沙箱（根 docker-compose.yml 的 app 服务、Testcontainers 测试）显式关闭，
    # 见 SecretStrengthGuard 类注释；deploy/docker-compose.yml 不设此变量=沿用默认 true。
    secret-guard:
      enabled: ${KCGL_SECRET_GUARD:true}
  item-code:
    # 价格码是否进管理号（A1 口径，默认含；对外业务格式，变更须甲方确认后随发版固化）
    include-price-code: ${KCGL_ITEM_CODE_INCLUDE_PRICE_CODE:true}
  image:
    # 图片落盘根目录（orig/ 原图与 thumb/ 缩略图两子目录）；生产由部署卷挂载注入
    dir: ${KCGL_IMAGE_DIR:./data/images}
    # 单文件上限 5MB（docs/01 7.5）；客户端已压至 ≤0.3MB，此为绕过直传 API 的兜底
    max-upload-bytes: ${KCGL_IMAGE_MAX_BYTES:5242880}
    # 解码前读头校验的像素上限（防像素炸弹 OOM）
    max-pixels: ${KCGL_IMAGE_MAX_PIXELS:8000}
  yahoo:
    # 受注 xlsx 管线（docs/01 7.4，D-069）。列映射/表头契约钉死在 YahooOrderParser
    # （受注导出 A-U 官方 21 列，样张已到位）——格式变更本需发版重验语义
    imports-dir: ${KCGL_YAHOO_IMPORTS_DIR:./data/imports}
    max-file-bytes: ${KCGL_YAHOO_MAX_FILE_BYTES:5242880}   # 5MB 防御上限（受注实际文件 KB 级；zip ~100:1 放大面自 50MB 收紧）
    max-rows: ${KCGL_YAHOO_MAX_ROWS:100000}                  # 防御上限（受注年 ~2300 行）
    zombie-minutes: ${KCGL_YAHOO_ZOMBIE_MINUTES:30}          # processing 超阈值的僵尸批次启动自愈
    shipment-delay-warn-days: ${KCGL_YAHOO_SHIP_DELAY_DAYS:7} # 出荷待ち滞留红标/对账降灰阈值
  excel:
    # Excel 双模式导入/流式导出（docs/01 3.1）。模板列名与雅虎 CSV 同理放部署配置——
    # 格式变更本需发版验证；列名需调整时改此段重启即适配
    imports-dir: ${KCGL_EXCEL_IMPORTS_DIR:./data/excel-imports}
    max-file-bytes: ${KCGL_EXCEL_MAX_FILE_BYTES:20971520}   # 20MB：2 万行 xlsx 上限
    max-rows: ${KCGL_EXCEL_MAX_ROWS:20000}                   # 两周日量（1000 件/天）余量
    zombie-minutes: ${KCGL_EXCEL_ZOMBIE_MINUTES:30}          # processing 超阈值的僵尸批次启动自愈
    # 19 列固定索引契约（D-058 E）：前 13 列对齐录入表单字段，后 6 列为 D-017 扩展属性
    columns:
      item-code: "管理番号"
      venue-code: "会場コード"
      buy-date: "落札日"
      purchase-price: "仕入単価"
      fee: "手数料"
      shipping-fee: "送料"
      tax: "消費税"
      warehouse: "倉庫"
      warehouse-in-date: "入庫日"
      shelf-no: "棚番号"
      group-no: "グループ番号"
      photo-date: "撮影日"
      remark: "備考"
      item-name: "商品名"
      category: "分類"
      author-kiln: "作者・窯元"
      size-text: "サイズ"
      weight-g: "重量（g）"
      sales-channel: "販売チャネル"
  self-check:
    # 每日自检（M3-⑦）：数据量阈值按「活库存」口径（A20 确认后可调）；每日 04:17 JST 执行
    item-volume-threshold: ${KCGL_SELF_CHECK_ITEM_VOLUME:150000}
    ledger-volume-threshold: ${KCGL_SELF_CHECK_LEDGER_VOLUME:3000000}
    log-volume-threshold: ${KCGL_SELF_CHECK_LOG_VOLUME:3000000}
    disk-warn-percent: ${KCGL_SELF_CHECK_DISK_WARN_PERCENT:80}
    scheduled: ${KCGL_SELF_CHECK_SCHEDULED:true}
  backup:
    # backup-status.json 路径（M7，D-077 决策 5）：backup.sh 产出的状态文件，
    # 系统状况页展示「直近バックアップ成功時刻」。空=功能关闭（本地开发默认）；
    # 部署环境由 compose 注入 /data/backup/backup-status.json（备份卷 ro 挂载）
    status-path: ${KCGL_BACKUP_STATUS:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never              # 生产收敛（docs/01 八节）

logging:
  level:
    root: INFO
  structured:
    format:
      # 单行 JSON（ECS）——docker logs/日志检索友好；MDC 的 traceId 自动随行输出
      console: ecs
