# kcgl-server 基线配置（全环境共用；环境差异全部走环境变量注入，见 docker-compose 与部署文档）
spring:
  application:
    name: kcgl-server
  datasource:
    # 时区链路（docs/01 7.8）：connectionTimeZone=Asia/Tokyo + forceConnectionTimeZoneToSession，
    # 实体一律 LocalDateTime，DATETIME 存 JST；rewriteBatchedStatements 为批量导入提速。
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:kcgl}?connectionTimeZone=Asia/Tokyo&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true&useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true
    username: ${DB_USER:kcgl}
    password: ${DB_PASSWORD:kcgl_dev_password}
    hikari:
      maximum-pool-size: 16          # 10 并发录入压测余量（docs/01 7.6）
      connection-timeout: 5000
      max-lifetime: 1740000
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 生产部署以环境变量注入独立迁移账号（SPRING_FLYWAY_USER/SPRING_FLYWAY_PASSWORD，
    # 与业务账号分离，见 docs/01 八节 DB 账号分离）；本地开发与测试复用数据源账号。
  jackson:
    time-zone: Asia/Tokyo
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: 12h           # SSE 长连接（docs/01 7.6），不依赖容器默认 30s
  lifecycle:
    timeout-per-shutdown-phase: 30s
  servlet:
    multipart:
      # 容器层粗筛（>6MB 直接拒并映射 400006）；业务上限 5MB 由 ImageService 精确校验
      max-file-size: 6MB
      max-request-size: 8MB

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}   # 生产 HTTPS 环境注入 true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# CSRF 双保险的 Origin 白名单（docs/01 八节）；生产注入实际域名，如 https://kcgl.example.com
kcgl:
  security:
    allowed-origins: ${KCGL_ALLOWED_ORIGINS:}
  item-code:
    # 价格码是否进管理号（A1 口径，默认含；对外业务格式，变更须甲方确认后随发版固化）
    include-price-code: ${KCGL_ITEM_CODE_INCLUDE_PRICE_CODE:true}
  image:
    # 图片落盘根目录（orig/ 原图与 thumb/ 缩略图两子目录）；生产由部署卷挂载注入
    dir: ${KCGL_IMAGE_DIR:./data/images}
    # 单文件上限 5MB（docs/01 7.5）；客户端已压至 ≤0.3MB，此为绕过直传 API 的兜底
    max-upload-bytes: ${KCGL_IMAGE_MAX_BYTES:5242880}
    # 解码前读头校验的像素上限（防像素炸弹 OOM）
    max-pixels: ${KCGL_IMAGE_MAX_PIXELS:8000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never              # 生产收敛（docs/01 八节）

logging:
  level:
    root: INFO
  structured:
    format:
      # 单行 JSON（ECS）——docker logs/日志检索友好；MDC 的 traceId 自动随行输出
      console: ecs
