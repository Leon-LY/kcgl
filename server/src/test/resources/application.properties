# 测试沙箱关闭启动期弱值拒启（SecretStrengthGuard，验收 12）。
# 理由：Testcontainers 的 MySQLContainer 默认账号口令就是 test（@ServiceConnection
# 注入到 spring.datasource.password），按定义命中弱值表——它是**测试夹具的口令**，
# 不是部署面。守卫的两个关闭点都在沙箱侧（本文件 + 根 docker-compose.yml），
# 部署包始终沿用默认值 true。
# 注意：本文件与 src/main/resources/application.yml 是**两个不同文件**，Spring Boot
# 两份都加载并按属性名合并，故此处只覆盖这一个键、不遮蔽主配置。
kcgl.security.secret-guard.enabled=false
